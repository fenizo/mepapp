name: Debug Staging Web
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Fix staging web - build on server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.WEB_SERVER_USER }}
        password: ${{ secrets.WEB_SERVER_PASSWORD }}
        command_timeout: 10m
        script: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          NPM_BIN=$(command -v npm || which npm || echo "npm")
          PM2_BIN=$(command -v pm2 || which pm2 || find /usr/local/bin /usr/bin $HOME/.nvm -name pm2 -type f 2>/dev/null | head -n 1)
          if [ -z "$PM2_BIN" ]; then PM2_BIN="npx pm2"; fi

          echo "=== PM2 logs (last 20 lines) ==="
          $PM2_BIN logs mep-web-staging --lines 20 --nostream 2>/dev/null || echo "No logs"

          echo ""
          echo "=== Checking build-manifest.json ==="
          cat ~/apps/mep-web-staging/mep-web/.next/app-build-manifest.json 2>/dev/null | head -50

          echo ""
          echo "=== Static build ID directory ==="
          BUILD_ID=$(cat ~/apps/mep-web-staging/mep-web/.next/BUILD_ID 2>/dev/null)
          echo "BUILD_ID: $BUILD_ID"
          ls -la ~/apps/mep-web-staging/mep-web/.next/static/$BUILD_ID/ 2>/dev/null || echo "No build ID directory in static!"

          echo ""
          echo "=== Rebuilding on server ==="
          cd ~/apps/mep-web-staging/mep-web
          $NPM_BIN install
          NEXT_PUBLIC_API_URL=http://127.0.0.1:8086 $NPM_BIN run build 2>&1 | tail -30

          echo ""
          echo "=== New BUILD_ID ==="
          cat .next/BUILD_ID

          echo ""
          echo "=== Restarting ==="
          $PM2_BIN delete mep-web-staging 2>/dev/null || true
          sleep 1
          export NEXT_PUBLIC_API_URL=http://127.0.0.1:8086
          $PM2_BIN start $NPM_BIN --name "mep-web-staging" --update-env -- start -- -p 3006
          sleep 5

          echo ""
          echo "=== Testing chunks locally ==="
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3006/
          echo " homepage"

          # Get chunk URLs from the actual page
          CHUNKS=$(curl -s http://127.0.0.1:3006/returning-customers | grep -o 'src="/_next/static[^"]*"' | sed 's/src="//;s/"//')
          for chunk in $CHUNKS; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3006$chunk")
            echo "$status $chunk"
          done

          echo ""
          echo "=== PM2 status ==="
          $PM2_BIN list
