name: Fix Nginx Staging Config
on:
  workflow_dispatch:
jobs:
  fix-nginx:
    runs-on: ubuntu-latest
    steps:
    - name: Fix Nginx Configuration
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: root
        password: ${{ secrets.ROOT_PASSWORD }}
        script: |
          echo "=== Backing up existing config ==="
          cp /etc/nginx/sites-enabled/staging.maduraielectriciansandplumbers.com.conf /etc/nginx/sites-enabled/staging.maduraielectriciansandplumbers.com.conf.backup

          echo ""
          echo "=== Creating new staging web config with SSL ==="
          tee /etc/nginx/sites-enabled/staging.maduraielectriciansandplumbers.com.conf << 'EOF'
          server {
              listen 80;
              server_name staging.maduraielectriciansandplumbers.com;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name staging.maduraielectriciansandplumbers.com;

              ssl_certificate /etc/nginx/ssl-certificates/staging.maduraielectriciansandplumbers.com.crt;
              ssl_certificate_key /etc/nginx/ssl-certificates/staging.maduraielectriciansandplumbers.com.key;

              location / {
                  proxy_pass http://127.0.0.1:3006;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          EOF

          echo ""
          echo "=== Also fix api.staging config to point to port 8086 ==="
          tee /etc/nginx/sites-enabled/api.staging.maduraielectriciansandplumbers.com.conf << 'EOF'
          server {
              listen 80;
              server_name api.staging.maduraielectriciansandplumbers.com;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name api.staging.maduraielectriciansandplumbers.com;

              ssl_certificate /etc/nginx/ssl-certificates/api.staging.maduraielectriciansandplumbers.com.crt;
              ssl_certificate_key /etc/nginx/ssl-certificates/api.staging.maduraielectriciansandplumbers.com.key;

              location / {
                  proxy_pass http://127.0.0.1:8086;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          EOF

          echo ""
          echo "=== Removing duplicate staging configs ==="
          rm -f /etc/nginx/sites-enabled/staging-web
          rm -f /etc/nginx/sites-enabled/staging-api

          echo ""
          echo "=== Testing and reloading Nginx ==="
          nginx -t && systemctl reload nginx

          echo ""
          echo "=== Testing connectivity ==="
          echo "Staging web (port 3006):"
          curl -s http://127.0.0.1:3006/ | head -c 50
          echo ""
          echo "Staging API (port 8086):"
          curl -s http://127.0.0.1:8086/api/call-logs?page=0\&size=1 | head -c 100
