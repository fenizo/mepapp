name: Fix Staging Setup
on:
  workflow_dispatch:
jobs:
  fix-staging:
    runs-on: ubuntu-latest
    steps:
    - name: Fix Staging Environment
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: root
        password: ${{ secrets.ROOT_PASSWORD }}
        script: |
          echo "=== Opening firewall for staging ports ==="
          ufw allow 8086/tcp || iptables -A INPUT -p tcp --dport 8086 -j ACCEPT || echo "Firewall config skipped"
          ufw allow 3006/tcp || iptables -A INPUT -p tcp --dport 3006 -j ACCEPT || echo "Firewall config skipped"

          echo ""
          echo "=== Setting up staging web ==="
          # Find where the staging web was deployed
          find /home -name "mep-web-staging" -type d 2>/dev/null | head -5

          # Check mep-web user's home
          ls -la /home/mep-web/apps/ 2>/dev/null || echo "No /home/mep-web/apps/"

          echo ""
          echo "=== Starting staging web ==="
          # Start the staging web from the correct location
          STAGING_WEB_DIR="/home/maduraielectr-staging/apps/mep-web-staging/mep-web"
          if [ -d "$STAGING_WEB_DIR" ]; then
            cd "$STAGING_WEB_DIR"
            # Kill any existing process on port 3006
            fuser -k 3006/tcp 2>/dev/null || true
            sleep 2
            # Install dependencies and start
            export NVM_DIR="/home/maduraielectr-staging/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            npm install --production 2>/dev/null || true
            nohup npm start -- -p 3006 > /tmp/staging-web.log 2>&1 &
            sleep 5
            echo "Staging web started"
          else
            echo "Staging web directory not found: $STAGING_WEB_DIR"
          fi

          echo ""
          echo "=== Final port check ==="
          netstat -tlpn | grep -E "8085|8086|3005|3006"
