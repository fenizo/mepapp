name: Fix Staging Setup
on:
  workflow_dispatch:
jobs:
  fix-staging:
    runs-on: ubuntu-latest
    steps:
    - name: Fix port 3006 and node_modules (root)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: root
        password: ${{ secrets.ROOT_PASSWORD }}
        command_timeout: 5m
        script: |
          echo "=== What is on port 3006? ==="
          ss -tlnp | grep 3006
          lsof -i:3006 2>/dev/null || netstat -tlnp | grep 3006

          echo ""
          echo "=== Kill ONLY the process on port 3006 ==="
          fuser -k 3006/tcp 2>/dev/null || true
          sleep 2

          echo "=== Verify port 3006 is free ==="
          ss -tlnp | grep 3006 && echo "STILL IN USE" || echo "Port 3006 is FREE"

          echo ""
          echo "=== Fix node_modules permissions ==="
          STAGING_DIR="/home/maduraielectr-staging/apps/mep-web-staging/mep-web"
          chown -R maduraielectr-staging:maduraielectr-staging "$STAGING_DIR/node_modules" 2>/dev/null || true
          chmod -R u+rwX "$STAGING_DIR/node_modules" 2>/dev/null || true
          rm -rf "$STAGING_DIR/node_modules"
          echo "node_modules cleaned"

          echo ""
          echo "=== All ports in use ==="
          ss -tlnp | grep -E ":(3003|3005|3006|8085|8086) "
