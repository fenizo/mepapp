name: Deploy Web Admin (Staging)
on:
  push:
    branches: [ staging ]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Build Next.js (Staging)
      run: |
        cd mep-web
        npm install
        NEXT_PUBLIC_API_URL=http://127.0.0.1:8086 npm run build
      env:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8086
    - name: Clean old build on server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.WEB_SERVER_USER }}
        password: ${{ secrets.WEB_SERVER_PASSWORD }}
        script: |
          echo "Cleaning old .next build directory..."
          rm -rf ~/apps/mep-web-staging/mep-web/.next
          echo "Done"
    - name: Deploy to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.WEB_SERVER_USER }}
        password: ${{ secrets.WEB_SERVER_PASSWORD }}
        source: "mep-web/.next,mep-web/public,mep-web/package.json,mep-web/next.config.js"
        target: "~/apps/mep-web-staging"
    - name: Restart Web App (Staging)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.WEB_SERVER_USER }}
        password: ${{ secrets.WEB_SERVER_PASSWORD }}
        script: |
          # Try to load environment
          for f in /etc/profile ~/.profile ~/.bash_profile ~/.bashrc; do
            [ -f "$f" ] && . "$f" && echo "Sourced $f"
          done

          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

          # Load NVM
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          # Find Binaries
          NPM_BIN=$(command -v npm || which npm || find /usr/local/bin /usr/bin $HOME/.nvm -name npm -type f 2>/dev/null | head -n 1 || echo "npm")
          PM2_BIN=$(command -v pm2 || which pm2 || find /usr/local/bin /usr/bin $HOME/.nvm -name pm2 -type f 2>/dev/null | head -n 1)

          if [ -z "$PM2_BIN" ] && command -v npx >/dev/null; then
            echo "PM2 not found. Will attempt to use npx pm2."
            PM2_BIN="npx pm2"
          elif [ -z "$PM2_BIN" ]; then
            echo "PM2 not found and npx not available. Fallback to 'pm2'."
            PM2_BIN="pm2"
          fi

          echo "Using NPM: $NPM_BIN"
          echo "Using PM2: $PM2_BIN"

          cd ~/apps/mep-web-staging/mep-web
          $NPM_BIN install --production

          # Stop existing process and kill any stale node processes on port 3006
          $PM2_BIN delete mep-web-staging 2>/dev/null || true
          $PM2_BIN kill 2>/dev/null || true
          sleep 2

          # Kill any remaining process on port 3006
          PID=$(lsof -ti:3006 2>/dev/null || true)
          if [ -n "$PID" ]; then
            echo "Killing stale process on port 3006: $PID"
            kill -9 $PID 2>/dev/null || true
            sleep 1
          fi

          export NEXT_PUBLIC_API_URL=http://127.0.0.1:8086
          $PM2_BIN start $NPM_BIN --name "mep-web-staging" --update-env -- start -- -p 3006
          sleep 3

          # Verify the new server is serving correct build
          echo ""
          echo "=== BUILD_ID on disk ==="
          cat ~/apps/mep-web-staging/mep-web/.next/BUILD_ID
          echo ""
          echo "=== Testing local access ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3006/ 2>/dev/null || echo "FAIL")
          echo "Homepage: $HTTP_CODE"
          echo ""
          echo "=== PM2 process list ==="
          $PM2_BIN list
